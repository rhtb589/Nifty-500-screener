# NIFTY 500 Screener
#
#   docker compose up --build -d
#   open http://localhost:5000
#
# Data files are bind-mounted so the in-container daily pipeline
# (scheduler.py, 17:05 IST Mon-Fri by default) persists updates to the host
# and they survive container recreation.

services:
  screener:
    build: .
    image: nifty-500-screener:latest
    container_name: nifty-500-screener
    ports:
      - "5000:5000"
    env_file:
      - .env # GOOGLE_API_KEY etc. — never baked into the image
    environment:
      TZ: Asia/Kolkata
      FLASK_HOST: 0.0.0.0
      FLASK_DEBUG: "0"
      PORT: "5000"
      ENABLE_DAILY_UPDATE: "1" # set "0" to disable the in-container scheduler
      UPDATE_TIME: "17:05" # 24h, in TZ above (after 15:30 IST market close)
      UPDATE_DAYS: "mon-fri" # or "daily"
      # RUN_ON_BOOT: "1" # uncomment to refresh data immediately on start
      # RELOAD_TOKEN: "change-me" # uncomment to protect POST /api/reload
      # Gunicorn (keep WEB_WORKERS=1 so /api/reload clears the only cache;
      # threads provide concurrency):
      WEB_WORKERS: "1"
      WEB_THREADS: "8"
      WEB_TIMEOUT: "120"
    volumes:
      - ./stock_data:/app/stock_data
      - ./nifty_500_data.csv:/app/nifty_500_data.csv
      - ./latest_snapshot.csv:/app/latest_snapshot.csv
      # .env is NOT baked into the image (.dockerignore); mount it read-only
      # so dotenv.load_dotenv() finds it. env_file above injects the same vars
      # as a fallback. If you recreate .env, run `docker compose down && up -d`.
      - ./.env:/app/.env:ro
    restart: unless-stopped
